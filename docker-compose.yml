# rag in Docker.
#
# On your machine run.bat starts only the database (`docker compose up -d db`);
# the backend and frontend run from source so they reload as you edit.
# On the VPS webos runs the whole file: `web` is the site, `db` its database.
# webos adds its own layer on top that publishes `web` on a loopback port and
# removes every other published port, so the 5434 below is for development only.
#
# Settings come from a .env file next to this one; see .env.example.

name: rag

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-rag}
      POSTGRES_DB: rag
    # 127.0.0.1 only: a published port without it goes straight through ufw on the VPS.
    # 5432 and 5433 are taken on Ali's machine.
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-5434}:5432"
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # SECRET_KEY, OPEN_SIGNUP, GOOGLE_CLIENT_ID and the rest. Optional, so starting
    # only the database in development works without one.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      # A shared server runs no models in its own memory and calls no private addresses.
      LOCAL_MODELS: "false"
      DATABASE_URL: postgresql://rag:${RAG_DB_PASSWORD:-rag}@db:5432/rag
    expose:
      - "8000"

volumes:
  rag-pgdata:

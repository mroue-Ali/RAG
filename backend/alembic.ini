# The app runs migrations itself on startup (app/db.py). This file is for the
# alembic command line, used when writing a new migration:
#
#   alembic revision --autogenerate -m "what changed"
#
# The database comes from backend/.env, the same way the app finds it.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
